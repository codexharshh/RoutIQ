name: RoutIQ quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Django and FastAPI tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: code/backend
    env:
      ROUTIQ_TEST_MODE: "1"
      DATABASE_URL: ""
      DJANGO_SECRET_KEY: ci-test-only
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      ROUTIQ_VISION_URL: http://127.0.0.1:8100
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/backend/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Verify production settings with a PostgreSQL URL
        env:
          DJANGO_SETTINGS_MODULE: routiq_config.production_settings
          ROUTIQ_TEST_MODE: "0"
          DJANGO_SECRET_KEY: ci-only-production-test-key-000000000000000000000000000000000000000000000000
          DATABASE_URL: postgresql://ci-user:ci-password@127.0.0.1:5432/routiq_ci
          DJANGO_ALLOWED_HOSTS: localhost,testserver
          DJANGO_CORS_ALLOWED_ORIGINS: https://routiq.example.invalid
          DJANGO_CSRF_TRUSTED_ORIGINS: https://routiq.example.invalid
        run: |
          python -c "from django.conf import settings; assert settings.DEBUG is False; assert settings.DATABASES['default']['ENGINE'] == 'django.db.backends.postgresql'; assert len(settings.SECRET_KEY) >= 50"

      - name: Verify production settings reject missing DATABASE_URL
        env:
          DJANGO_SETTINGS_MODULE: routiq_config.production_settings
          ROUTIQ_TEST_MODE: "0"
          DJANGO_SECRET_KEY: ci-only-production-test-key-000000000000000000000000000000000000000000000000
          DJANGO_ALLOWED_HOSTS: localhost,testserver
          DJANGO_CORS_ALLOWED_ORIGINS: https://routiq.example.invalid
          DJANGO_CSRF_TRUSTED_ORIGINS: https://routiq.example.invalid
        run: |
          if output="$(python -c "from django.conf import settings; print(settings.DATABASES['default']['ENGINE'])" 2>&1)"; then
            echo "Production settings unexpectedly accepted missing DATABASE_URL."
            exit 1
          fi
          echo "$output" | grep -F "DATABASE_URL is required in production"

      - name: Run Django tests with isolated test databases
        run: python manage.py test

      - name: Run FastAPI unit tests
        run: python -m unittest discover -s fastapi_service/tests -p "test_*.py"

  frontend:
    name: React quality checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: code
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: code/package-lock.json

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npx tsc -b --pretty false

      - name: Run frontend API payload test
        run: npx tsx tests/apiPayload.test.mjs

      - name: Run GPS location service test
        run: npx tsx tests/gpsLocationService.test.mjs

      - name: Build production frontend
        run: npm run build
